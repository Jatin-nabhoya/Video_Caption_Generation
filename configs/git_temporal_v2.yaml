# Idea 2 (v2): GIT-base + temporal adapter, gating only the adapter's change (v1 gate stayed at ~0). Identical to git_base.yaml (the v2 baseline, 5 epochs, CIDEr 101.3)
# except the adapter block and run_name, so any difference comes from the adapter.
run_name: git_temporal_v2
model_name: microsoft/git-base
hf_repo: jatinnabhoya/Video_Caption_Generation
data_root: /kaggle/input/datasets/jatinnabhoya/video-caption-generation/msvd
num_frames: 6
epochs: 5
batch_size: 4
grad_accum: 4
grad_checkpointing: true
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
repeats: 5
max_len: 40
num_beams: 3
seed: 42
eval_batch_size: 4
temporal_adapter:
  layers: 1        # transformer layers attending across frames
  heads: 8
  dropout: 0.1
  lr: 3.0e-4       # adapter starts from scratch; v1 (1e-4) left the gate at ~0
