# BLIP-2 baseline on MSR-VTT: same recipe as configs/blip2.yaml (MSVD); repeats 1 (6,513 train videos ~ MSVD's 1,200 x 5)
run_name: blip2_msrvtt_v1
model_name: Salesforce/blip2-opt-2.7b
hf_repo: jatinnabhoya/Video_Caption_Generation
data_root: /kaggle/input/msrvtt-original/msrvtt   # set automatically by the notebook (Cell 1)
num_frames: 6
epochs: 3
batch_size: 4
grad_accum: 4
eval_batch_size: 4
repeats: 1
max_len: 40
lr: 2.0e-5
weight_decay: 0.05
warmup_ratio: 0.1
num_beams: 3
seed: 42
